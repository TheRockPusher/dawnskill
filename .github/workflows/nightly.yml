name: Nightly

on:
  schedule:
    - cron: "17 3 * * *" # daily: property tests with a fresh seed
    - cron: "17 4 * * 0" # weekly (Sunday): mutation testing
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * *'
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      FC_SEED: ${{ github.run_id }}
      FC_NUM_RUNS: "2000"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print seed
        run: |
          echo "FC_SEED=${FC_SEED} FC_NUM_RUNS=${FC_NUM_RUNS}"
          echo "Replay: FC_SEED=${FC_SEED} FC_NUM_RUNS=${FC_NUM_RUNS} pnpm test"
          {
            echo "### fast-check seed"
            echo
            echo "Replay locally: \`FC_SEED=${FC_SEED} FC_NUM_RUNS=${FC_NUM_RUNS} pnpm test\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Test
        run: pnpm test

  mutation:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 4 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: false
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mutation testing
        run: pnpm mutation
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation
          if-no-files-found: warn
